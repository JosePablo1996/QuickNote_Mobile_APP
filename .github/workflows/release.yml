name: Build and Release APK

on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:

jobs:
  build:
    name: Build APK
    runs-on: ubuntu-latest
    
    permissions:
      contents: write  # Permiso necesario para crear releases
    
    steps:
      # 1. Clonar el código
      - name: Checkout code
        uses: actions/checkout@v4

      # 2. Configurar Java (requerido para Android)
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      # 3. Configurar Flutter
      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: '3.x'

      # 4. Instalar dependencias
      - name: Get dependencies
        run: flutter pub get

      # 5. Decodificar el keystore desde el secreto Base64
      - name: Decode Keystore
        run: |
          echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 --decode > android/app/quicknote-keystore.jks

      # 6. Crear archivo key.properties para la firma
      - name: Create key.properties
        run: |
          cat > android/key.properties << EOF
          storePassword=${{ secrets.KEYSTORE_PASSWORD }}
          keyPassword=${{ secrets.KEY_PASSWORD }}
          keyAlias=${{ secrets.KEY_ALIAS }}
          storeFile=quicknote-keystore.jks
          EOF

      # 7. Construir APK firmado (todas las arquitecturas)
      - name: Build APK
        run: flutter build apk --release --split-per-abi

      # 8. Firmar APK con apksigner (para compatibilidad con Android 14+)
      - name: Sign APKs with v2/v3 scheme
        run: |
          # Obtener la ruta de build-tools
          BUILD_TOOLS="$ANDROID_HOME/build-tools/34.0.0"
          
          # Firmar cada APK con el esquema v2+v3 (requerido para API 34+)
          for apk in build/app/outputs/flutter-apk/*.apk; do
            echo "Firmando: $apk"
            "$BUILD_TOOLS/apksigner" sign \
              --ks android/app/quicknote-keystore.jks \
              --ks-key-alias ${{ secrets.KEY_ALIAS }} \
              --ks-pass pass:${{ secrets.KEYSTORE_PASSWORD }} \
              --key-pass pass:${{ secrets.KEY_PASSWORD }} \
              "$apk"
          done

      # 9. Verificar la firma de los APKs
      - name: Verify signatures
        run: |
          BUILD_TOOLS="$ANDROID_HOME/build-tools/34.0.0"
          for apk in build/app/outputs/flutter-apk/*.apk; do
            echo "Verificando: $apk"
            "$BUILD_TOOLS/apksigner" verify --verbose "$apk"
          done

      # 10. Subir APKs como artefactos del workflow
      - name: Upload APK artifacts
        uses: actions/upload-artifact@v4
        with:
          name: release-apks
          path: build/app/outputs/flutter-apk/*.apk
          retention-days: 30

      # 11. Crear Release en GitHub y adjuntar APKs (solo en tags)
      - name: Create Release
        uses: softprops/action-gh-release@v1
        if: startsWith(github.ref, 'refs/tags/')
        with:
          files: |
            build/app/outputs/flutter-apk/app-armeabi-v7a-release.apk
            build/app/outputs/flutter-apk/app-arm64-v8a-release.apk
            build/app/outputs/flutter-apk/app-x86_64-release.apk
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}